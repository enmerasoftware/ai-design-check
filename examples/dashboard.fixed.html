<!doctype html>
<!-- dashboard.html after the ai-design-fix passes. Direction: an app owner checking the week; world: a harbour at
     dusk (ink ramp); accent: tide teal on the selection, the primary action and the leading bar. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidepool</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-feature-settings: "tnum"; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body class="bg-[#0b0d14] text-[#eef0f5]">
<div class="flex min-h-screen">
  <aside class="w-64 border-r border-white/10 bg-[#07080d] p-5">
    <div class="flex items-center gap-2">
      <span class="flex size-8 items-center justify-center rounded-lg bg-[#1a1e28] text-teal-300"><svg viewBox="0 0 24 24"><path d="M2 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M2 17c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg></span>
      <span class="text-base font-semibold">Tidepool</span>
    </div>
    <nav class="mt-8 flex flex-col gap-1 text-sm" id="nav"></nav>
    <div class="mt-8 rounded-xl border border-white/10 p-4">
      <p class="text-sm font-medium">Free plan · 2 of 3 apps</p>
      <p class="mt-1 text-xs text-[#a3a9b8]">Track up to 25 apps and hourly ranks on Pro.</p>
      <a class="mt-3 inline-block text-xs font-medium text-teal-300 hover:text-teal-200" href="#">Compare plans</a>
    </div>
  </aside>

  <main class="flex-1 p-8">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-semibold">Overview</h1>
        <p class="mt-1 text-sm text-[#a3a9b8]">3 apps · 21–27 October</p>
      </div>
      <div class="flex items-center gap-2">
        <label class="flex h-9 w-64 items-center gap-2 rounded-lg border border-white/10 bg-[#11141c] px-3 text-sm text-[#7a8296] focus-within:border-teal-400">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="w-full bg-transparent text-[#eef0f5] placeholder:text-[#7a8296] focus:outline-none" placeholder="Search" aria-label="Search">
        </label>
        <button class="h-9 rounded-lg bg-teal-400 px-4 text-sm font-medium text-[#07080d] transition-colors hover:bg-teal-300">Explain this week</button>
      </div>
    </div>

    <div class="mt-8 grid grid-cols-4 gap-4" id="stats"></div>

    <div class="mt-4 grid grid-cols-3 gap-4">
      <section class="col-span-2 rounded-xl border border-white/10 bg-[#11141c] p-5">
        <div class="flex items-baseline justify-between">
          <h2 class="text-base font-medium">Downloads this week</h2>
          <p class="text-xs text-[#a3a9b8]">Updated 08:00</p>
        </div>
        <div class="mt-5 flex h-44 items-end gap-2" id="bars"></div>
        <div class="mt-2 flex justify-between text-xs text-[#7a8296]"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
      </section>
      <section class="rounded-xl border border-white/10 bg-[#11141c] p-5">
        <h2 class="text-base font-medium">Top keywords</h2>
        <ul class="mt-4 flex flex-col divide-y divide-white/5 text-sm" id="keywords"></ul>
      </section>
    </div>

    <section class="mt-4 rounded-xl border border-white/10 bg-[#11141c] p-5">
      <div class="flex items-baseline justify-between">
        <h2 class="text-base font-medium">Recent reviews</h2>
        <a class="text-xs font-medium text-teal-300 hover:text-teal-200" href="#">Open reviews</a>
      </div>
      <table class="mt-3 w-full text-left text-sm">
        <thead class="text-xs text-[#7a8296]"><tr><th class="py-2 font-normal">Rating</th><th class="py-2 font-normal">Review</th><th class="py-2 font-normal">Country</th><th class="py-2 font-normal">Date</th><th class="py-2 text-right font-normal">Reply</th></tr></thead>
        <tbody class="divide-y divide-white/5" id="reviews"></tbody>
      </table>
    </section>
  </main>
</div>
<script>
  const icon = (d) => `<svg viewBox="0 0 24 24">${d}</svg>`;
  const nav = [
    ['Overview', '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', true, ''],
    ['Rankings', '<path d="m3 17 6-6 4 4 8-8"/><path d="M14 7h7v7"/>', false, ''],
    ['Reviews', '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>', false, '18'],
    ['Growth', '<path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/>', false, ''],
    ['Settings', '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>', false, ''],
  ];
  document.getElementById('nav').innerHTML = nav.map(([label, path, active, count]) =>
    `<a class="${active ? 'bg-[#1a1e28] text-[#eef0f5]' : 'text-[#a3a9b8] hover:bg-[#11141c] hover:text-[#eef0f5]'} flex h-9 items-center gap-3 rounded-lg px-3 transition-colors" href="#">${icon(path)}<span>${label}</span>${count ? `<span class="ml-auto text-xs text-[#7a8296]">${count}</span>` : ''}</a>`).join('');

  const stats = [
    ['Downloads', '48,210', '+12% vs last week', true],
    ['Revenue', '$124,860', '+8.1% vs last week', true],
    ['Average rating', '4.7', '−0.1 vs last week', false],
    ['Keywords in the top 10', '7', '+2 vs last week', true],
  ];
  document.getElementById('stats').innerHTML = stats.map(([label, value, change, up]) =>
    `<div class="rounded-xl border border-white/10 bg-[#11141c] p-4"><p class="text-sm text-[#a3a9b8]">${label}</p><p class="mt-2 text-3xl font-medium">${value}</p><p class="mt-1 text-xs ${up ? 'text-emerald-400' : 'text-rose-400'}">${change}</p></div>`).join('');

  const days = [40, 55, 48, 70, 64, 88, 100];
  document.getElementById('bars').innerHTML = days.map((height, index) =>
    `<div class="flex-1 rounded-md ${index === days.length - 1 ? 'bg-teal-400' : 'bg-[#232836]'}" style="height:${height}%"></div>`).join('');

  const keywords = [['habit tracker', '#3', '+4'], ['daily planner', '#6', '+1'], ['routine app', '#9', '−2'], ['mood journal', '#14', '+5']];
  const reviews = [
    [5, 'Finally a habit app that does not nag me.', 'United States', '27 Oct', 'Replied'],
    [2, 'Sync between my phone and iPad keeps failing.', 'Germany', '26 Oct', 'Draft ready'],
    [4, 'Love the streaks, wish the widget updated faster.', 'United Kingdom', '26 Oct', 'Draft ready'],
    [5, 'Simple and calm. Exactly what I wanted.', 'Türkiye', '25 Oct', 'Replied'],
    [3, 'Good, but I miss a dark widget on the lock screen.', 'Japan', '25 Oct', 'Draft ready'],
    [5, 'Kept a 90 day streak thanks to the gentle reminders.', 'Brazil', '24 Oct', 'Replied'],
  ];
  document.getElementById('reviews').innerHTML = reviews.map(([stars, text, country, date, reply]) =>
    `<tr><td class="py-3 ${stars <= 2 ? 'text-rose-400' : 'text-[#eef0f5]'}">${stars}.0</td><td class="py-3 text-[#eef0f5]">${text}</td><td class="py-3 text-[#a3a9b8]">${country}</td><td class="py-3 text-[#a3a9b8]">${date}</td><td class="py-3 text-right ${reply === 'Replied' ? 'text-[#7a8296]' : 'text-teal-300'}">${reply}</td></tr>`).join('');

  document.getElementById('keywords').innerHTML = keywords.map(([keyword, rank, change]) =>
    `<li class="flex items-center justify-between py-3"><span>${keyword}</span><span class="flex items-center gap-3"><span class="text-xs ${change.startsWith('+') ? 'text-emerald-400' : 'text-rose-400'}">${change}</span><span class="w-8 text-right font-medium">${rank}</span></span></li>`).join('');
</script>
</body>
</html>
